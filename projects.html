<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Discord embed -->
    <meta property="og:title" content="UofT STAR - Projects">
    <meta property="og:description" content="A student led team dedicated to model rockets, open to anyone regardless of major.">
    <meta property="og:image" content="https://www.utstar.ca/Images/UTSTAR_logo.webp">
    <meta property="og:url" content="https://www.utstar.ca/projects.html">
    <!-- Force big image in embed -->
    <meta name="twitter:card" content="summary_large_image" />
    <!--               -->

    <meta name="description" content="A student led team dedicated to model rockets, open to anyone regardless of major.">
    
    <title>UofT STAR - Projects</title>
    <link rel="icon" type="image/webp" href="Images/UTSTAR_logo.webp">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body data-page="projects">
    <!-- Global Stars Background -->
    <div class="stars-background"></div>


    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="Images/UTSTAR_logo.webp" alt="UofT STAR Logo" class="logo-img">
                <span>UofT STAR</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link" data-page="home">Home</a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link" data-page="about">About</a>
                </li>
                <li class="nav-item">
                    <a href="projects.html" class="nav-link" data-page="projects">Projects</a>
                </li>
                <li class="nav-item">
                    <a href="events.html" class="nav-link" data-page="events">Events</a>
                </li>
                <li class="nav-item">
                    <a href="team.html" class="nav-link" data-page="team">Team</a>
                </li>
                <li class="nav-item">
                    <a href="contact.html" class="nav-link" data-page="contact">Contact</a>
                </li>
                <!--
                <li class="nav-item">
                    <a href="constitution.html" class="nav-link">Constitution</a>
                </li>
                -->
                <li class="nav-item">
                    <a href="trivia.html" class="nav-link" data-page="trivia">Trivia</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>


    <main class="standalone-page">
    <!-- Projects Section -->
    <section id="projects" class="section">
        <div class="container">
            <h2 class="section-title">Project List</h2>
            <div class="projects-grid" id="projectsGrid">
                <!-- Projects will be loaded from website-data.js -->
                <div class="loading-placeholder">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading projects...</p>
                </div>
            </div>
        </div>
    </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="Images/UTSTAR_logo.webp" alt="UofT STAR Logo" class="footer-logo-img">
                    <span>UofT STAR</span>
                </div>
                
                <div class="footer-info">
                    <div class="footer-map" id="footer-map"></div>
                </div>
                
                <div class="footer-social">
                    <a href="https://www.instagram.com/uoftstar/" target="_blank" rel="noopener"><i class="fab fa-instagram"></i></a>
                    <a href="mailto:utstar@studentorg.utoronto.ca" target="_blank" rel="noopener"><i class="fas fa-envelope"></i></a>
                    <a href="https://discord.gg/nNsQn5J4SU" target="_blank" rel="noopener"><i class="fab fa-discord"></i></a>
                </div>
            </div>
            <p>&copy; 2026 University of Toronto Student Team for Amateur Rocketry. All rights reserved.</p>
        </div>
    </footer>

    <!-- Back to Top Button -->
    <button id="backToTop" class="back-to-top" onclick="scrollToTop()">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- Project Modal -->
    <div id="projectModal" class="project-modal">
        <div class="project-modal-content">
            <button class="project-modal-close" onclick="closeProjectModal()">&times;</button>
            <div class="project-modal-body">
                <div class="project-modal-icon">
                    <i id="modalIcon"></i>
                </div>
                <h2 id="modalTitle"></h2>
                <div class="project-modal-status">
                    <span id="modalStatus" class="status-badge"></span>
                </div>
                <p id="modalDescription"></p>
                <div id="modalCarousel" class="project-carousel">
                    <!-- Carousel images will be loaded here -->
                </div>
                <div id="modalDetails" class="project-details">
                    <!-- Additional project details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.7/dist/leaflet-rotate.js"></script>
    <script src="js/website-data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
