<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <!-- Discord embed -->
        <meta content="UofT STAR - Projects" property="og:title">
        <meta content="A student led team dedicated to model rockets, open to anyone regardless of major." property="og:description">
        <meta content="https://www.utstar.ca/Images/UTSTAR_logo.webp" property="og:image">
        <meta content="https://www.utstar.ca/projects.html" property="og:url">
        <!-- Force big image in embed -->
        <meta content="summary_large_image" name="twitter:card">
        <meta content="A student led team dedicated to model rockets, open to anyone regardless of major." name="description">
        <title>UofT STAR - Projects</title>
        <link href="Images/UTSTAR_logo.webp" rel="icon" type="image/webp">
        <link href="css/style.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    </head>
    <body data-page="projects">
        <!-- Global Stars Background -->
        <div class="stars-background"></div>
        <!-- Navigation -->
        <nav id="site-navbar"></nav>
        <main class="standalone-page">
            <!-- Projects Section -->
            <section class="section" id="projects">
                <div class="container">
                    <h2 class="section-title">Project List</h2>
                    <div class="projects-grid" id="projectsGrid">
                        <!-- Projects will be loaded from website-data.js -->
                        <div class="loading-placeholder">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Loading projects...</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <!-- Footer -->
        <footer id="site-footer"></footer>
        <!-- Back to Top Button -->
        <!-- Project Modal -->
        <div class="project-modal" id="projectModal">
            <div class="project-modal-content">
                <button class="project-modal-close" onclick="closeProjectModal()">×</button>
                <div class="project-modal-body">
                    <div class="project-modal-icon">
                        <i id="modalIcon"></i>
                    </div>
                    <h2 id="modalTitle"></h2>
                    <div class="project-modal-status">
                        <span class="status-badge" id="modalStatus"></span>
                    </div>
                    <p id="modalDescription"></p>
                    <div class="project-carousel" id="modalCarousel">
                        <!-- Carousel images will be loaded here -->
                    </div>
                    <div class="project-details" id="modalDetails">
                        <!-- Additional project details will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
        <script src="js/website-data.js"></script>
        <script src="js/components.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
