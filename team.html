<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <!-- Discord embed -->
        <meta content="UofT STAR - Team" property="og:title">
        <meta content="A student led team dedicated to model rockets, open to anyone regardless of major." property="og:description">
        <meta content="https://www.utstar.ca/Images/UTSTAR_logo.webp" property="og:image">
        <meta content="https://www.utstar.ca/team.html" property="og:url">
        <!-- Force big image in embed -->
        <meta content="summary_large_image" name="twitter:card">
        <meta content="A student led team dedicated to model rockets, open to anyone regardless of major." name="description">
        <title>UofT STAR - Team</title>
        <link href="Images/UTSTAR_logo.webp" rel="icon" type="image/webp">
        <link href="css/style.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    </head>
    <body data-page="team">
        <!-- Global Stars Background -->
        <div class="stars-background"></div>
        <!-- Navigation -->
        <nav id="site-navbar"></nav>
        <main class="standalone-page">
            <!-- Team Section -->
            <section class="section" id="team">
                <div class="container">
                    <h2 class="section-title">Leadership Team</h2>
                    <div class="team-grid" id="teamGrid">
                        <!-- Team members will be loaded from website-data.js -->
                        <div class="loading-placeholder">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Loading team members...</p>
                        </div>
                    </div>
                    <div style="text-align: center; margin-top: 2rem;">
                        <p style="color: var(--muted);">We're a diverse group of students spanning physics, engineering, computer science, and more. Our executive committee leads various subsystems while fostering a collaborative learning environment.</p>
                    </div>
                </div>
            </section>
        </main>
        <!-- Footer -->
        <footer id="site-footer"></footer>
        <!-- Back to Top Button -->
        <!-- Project Modal -->
        <script src="js/website-data.js"></script>
        <script src="js/components.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
